<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis ciudades</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mu:#6b7280;--ac:#1d6fd6;--bd:#e3e1da}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#20242a;--tx:#e8e9eb;--mu:#9aa1ab;--ac:#5aa2ff;--bd:#333943}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--ac)}
.stat span{font-size:12px;color:var(--mu)}
#map{height:300px;border-radius:12px;border:1px solid var(--bd);margin-bottom:12px;z-index:0}
form,.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1;min-width:0}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px}
textarea{width:100%;resize:vertical}
button{cursor:pointer}
button:disabled{opacity:.6}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);width:100%}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools>*{flex:1}
.city{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.city h3{margin:0;font-size:17px;cursor:pointer}
.m{color:var(--mu);font-size:13px}
.x{padding:2px 9px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:24px}
#msg{font-size:13px;color:var(--mu);min-height:18px;margin-bottom:8px}
</style>
</head>
<body>
<main>
<h1>🌍 Mis ciudades</h1>
<div class="stats">
<div class="stat"><b id="sC">0</b><span>ciudades</span></div>
<div class="stat"><b id="sP">0</b><span>países</span></div>
<div class="stat"><b id="sV">0</b><span>visitas</span></div>
</div>

<div id="map"></div>

<form id="f">
<div class="row">
<input id="city" placeholder="Ciudad" required>
<input id="country" placeholder="País" required>
</div>
<div class="row">
<input id="date" type="month" title="Mes del viaje (opcional)">
<input id="year" type="number" min="1900" max="2100" placeholder="o solo el año">
</div>
<textarea id="note" rows="2" placeholder="Notas (opcional)"></textarea>
<div id="msg">La ubicación se busca sola. Si no la encuentra, toca el mapa para marcarla.</div>
<button class="p" id="add" type="submit">Añadir visita</button>
</form>

<div class="tools">
<select id="sort">
<option value="recent">Más recientes</option>
<option value="old">Más antiguas</option>
<option value="az">Ciudad A–Z</option>
<option value="country">Por país</option>
</select>
<input id="q" placeholder="Buscar…">
</div>
<button id="loc" type="button" class="card" style="width:100%;display:none"></button>

<div id="list"></div>

<details class="card">
<summary>Copia de seguridad</summary>
<p class="m">Exporta para guardar tus datos o pega una copia guardada y pulsa Importar.</p>
<textarea id="data" rows="5"></textarea>
<div class="row" style="margin-top:8px">
<button id="exp" type="button">Exportar</button>
<button id="imp" type="button">Importar</button>
</div>
</details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
var KEY="ciudades-visitadas-v1", visits=[], picked=null, map=null, layer=null, pin=null;
var $=function(id){return document.getElementById(id)};
var meses=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function load(){try{var r=localStorage.getItem(KEY);visits=r?JSON.parse(r):[]}catch(e){visits=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(visits))}catch(e){}}
function when(v){return v.month?meses[v.month-1]+" "+v.year:(v.year?String(v.year):"Sin fecha")}
function key(v){return v.year?v.year*100+(v.month||0):0}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return s.trim().toLowerCase()}
function ck(v){return norm(v.city)+"|"+norm(v.country)}
function say(t){$("msg").textContent=t}

if(window.L){
map=L.map("map",{worldCopyJump:true}).setView([30,10],2);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
layer=L.layerGroup().addTo(map);
map.on("click",function(e){
picked=[e.latlng.lat,e.latlng.lng];
if(pin)map.removeLayer(pin);
pin=L.marker(e.latlng).addTo(map);
say("📍 Ubicación marcada a mano; se usará al añadir.");
});
}else{$("map").innerHTML='<div class="empty">El mapa necesita conexión a internet.</div>'}

function drawMap(fit){
if(!map)return;
layer.clearLayers();
var g={},pts=[];
visits.forEach(function(v){
if(v.lat==null)return;
var k=ck(v);(g[k]=g[k]||{v:v,w:[]}).w.push(when(v));
});
Object.keys(g).forEach(function(k){
var o=g[k],m=L.circleMarker([o.v.lat,o.v.lng],{radius:7,color:"#1d6fd6",fillColor:"#1d6fd6",fillOpacity:.8});
m.bindPopup("<b>"+esc(o.v.city)+"</b><br>"+esc(o.v.country)+"<br>"+o.w.map(esc).join(", "));
m.addTo(layer);o.v._m=m;pts.push([o.v.lat,o.v.lng]);
});
if(fit&&pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:6});
}

function render(fit){
var cities={},countries={},pend=0;
visits.forEach(function(v){cities[ck(v)]=1;countries[norm(v.country)]=1;if(v.lat==null)pend++});
$("sC").textContent=Object.keys(cities).length;
$("sP").textContent=Object.keys(countries).length;
$("sV").textContent=visits.length;
$("loc").style.display=pend?"block":"none";
$("loc").textContent="📍 Localizar "+pend+" visita"+(pend>1?"s":"")+" sin ubicación";
var q=norm($("q").value),s=$("sort").value;
var l=visits.filter(function(v){return !q||(v.city+" "+v.country+" "+(v.note||"")).toLowerCase().indexOf(q)>-1});
l.sort(function(a,b){
if(s==="old")return key(a)-key(b);
if(s==="az")return a.city.localeCompare(b.city,"es");
if(s==="country")return a.country.localeCompare(b.country,"es")||a.city.localeCompare(b.city,"es");
return key(b)-key(a);
});
$("list").innerHTML=l.length?l.map(function(v){
return '<div class="card city"><div><h3 data-go="'+v.id+'">'+esc(v.city)+'</h3><div class="m">'+esc(v.country)+' · '+when(v)+(v.lat==null?' · sin ubicación':'')+'</div>'+(v.note?'<div style="margin-top:6px">'+esc(v.note)+'</div>':'')+'</div><button class="x" data-id="'+v.id+'" aria-label="Borrar">✕</button></div>';
}).join(""):'<div class="empty">Aún no hay visitas. Añade la primera arriba ✈️</div>';
drawMap(fit);
}

function geocode(city,country){
return fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(city+", "+country))
.then(function(r){return r.json()})
.then(function(a){return a&&a[0]?[parseFloat(a[0].lat),parseFloat(a[0].lon)]:null})
.catch(function(){return null});
}
function known(v){
for(var i=0;i<visits.length;i++){if(visits[i].lat!=null&&ck(visits[i])===ck(v))return [visits[i].lat,visits[i].lng]}
return null;
}

$("f").addEventListener("submit",function(e){
e.preventDefault();
var d=$("date").value,y=parseInt($("year").value,10)||null,m=null;
if(d){y=parseInt(d.slice(0,4),10);m=parseInt(d.slice(5,7),10)}
var v={id:Date.now()+Math.random().toString(36).slice(2,6),city:$("city").value.trim(),country:$("country").value.trim(),year:y,month:m,note:$("note").value.trim(),lat:null,lng:null};
$("add").disabled=true;say("Buscando ubicación…");
var p=picked||known(v);
(p?Promise.resolve(p):geocode(v.city,v.country)).then(function(c){
if(c){v.lat=c[0];v.lng=c[1];say("Visita añadida.")}else say("Añadida sin ubicación. Puedes localizarla después.");
visits.push(v);save();$("f").reset();picked=null;
if(pin&&map){map.removeLayer(pin);pin=null}
$("add").disabled=false;render(true);
});
});

$("loc").addEventListener("click",function(){
var todo=visits.filter(function(v){return v.lat==null}),i=0;
$("loc").disabled=true;
function next(){
if(i>=todo.length){save();$("loc").disabled=false;say("Listo.");render(true);return}
var v=todo[i++];say("Localizando "+v.city+" ("+i+"/"+todo.length+")…");
var c=known(v);
if(c){v.lat=c[0];v.lng=c[1];next();return}
geocode(v.city,v.country).then(function(r){
if(r){v.lat=r[0];v.lng=r[1]}
setTimeout(next,1100);
});
}
next();
});

$("list").addEventListener("click",function(e){
var id=e.target.getAttribute("data-id"),go=e.target.getAttribute("data-go");
if(id&&confirm("¿Borrar esta visita?")){visits=visits.filter(function(v){return v.id!==id});save();render(false)}
if(go&&map){
var v=visits.filter(function(x){return x.id===go})[0];
if(v&&v.lat!=null){map.flyTo([v.lat,v.lng],8);if(v._m)v._m.openPopup();window.scrollTo({top:0,behavior:"smooth"})}
}
});
$("sort").addEventListener("change",function(){render(false)});
$("q").addEventListener("input",function(){render(false)});
$("exp").addEventListener("click",function(){
$("data").value=JSON.stringify(visits.map(function(v){var c={};for(var k in v)if(k!=="_m")c[k]=v[k];return c}));
$("data").select();
});
$("imp").addEventListener("click",function(){
try{
var a=JSON.parse($("data").value);
if(!Array.isArray(a))throw 0;
if(confirm("Esto reemplazará tus datos actuales. ¿Continuar?")){visits=a;save();render(true)}
}catch(e){alert("El texto no es una copia válida.")}
});
load();render(true);
})();
</script>
</body>
</html>
